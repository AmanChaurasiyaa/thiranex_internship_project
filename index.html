<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Dashboard</title>
<meta name="description" content="Live weather by city, powered by the Open-Meteo REST API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. DESIGN TOKENS (CSS variables)
   The sky colours are swapped by JS via [data-sky] on <body>
   ========================================================= */
:root {
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --ink: #0f1b2d;
  --ink-soft: rgba(15, 27, 45, .68);
  --panel: rgba(255, 255, 255, .62);
  --panel-solid: #ffffff;
  --line: rgba(15, 27, 45, .12);
  --accent: #1d5fd1;
  --danger: #b3261e;
  --danger-bg: #fdeceb;
  --sky-a: #bcd9f7;
  --sky-b: #eaf3fc;
}
body[data-sky="clear-night"]  { --sky-a: #14213d; --sky-b: #3b4a7a; --ink: #f2f5ff; --ink-soft: rgba(242,245,255,.72); --panel: rgba(255,255,255,.1); --line: rgba(255,255,255,.18); --accent: #9db8ff; }
body[data-sky="cloudy"]       { --sky-a: #aab4c0; --sky-b: #dde3ea; }
body[data-sky="cloudy-night"] { --sky-a: #1f2a3a; --sky-b: #46546a; --ink: #f2f5ff; --ink-soft: rgba(242,245,255,.72); --panel: rgba(255,255,255,.1); --line: rgba(255,255,255,.18); --accent: #9db8ff; }
body[data-sky="rain"]         { --sky-a: #6f8aa3; --sky-b: #b9c9d8; }
body[data-sky="snow"]         { --sky-a: #cfe3f3; --sky-b: #f6fafd; }
body[data-sky="storm"]        { --sky-a: #3d4658; --sky-b: #7b8599; --ink: #f2f5ff; --ink-soft: rgba(242,245,255,.72); --panel: rgba(255,255,255,.1); --line: rgba(255,255,255,.18); --accent: #9db8ff; }
body[data-sky="clear-day"]    { --sky-a: #7db7f2; --sky-b: #fdf0cf; }

/* =========================================================
   2. BASE + LAYOUT
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(165deg, var(--sky-a), var(--sky-b));
  background-attachment: fixed;
  transition: background .6s ease, color .3s ease;
  line-height: 1.5;
}
.app { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }

.topbar {
  display: flex; flex-wrap: wrap; gap: 14px;
  align-items: center; justify-content: space-between;
  margin-bottom: 26px;
}
.brand { font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; margin: 0; }

/* Search form */
.search { display: flex; flex: 1 1 340px; max-width: 520px; gap: 8px; }
.search input {
  flex: 1; min-width: 0;
  font: inherit; color: inherit;
  padding: 13px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(10px);
}
.search input::placeholder { color: var(--ink-soft); }
button {
  font: inherit; cursor: pointer;
  border-radius: 999px; border: 1px solid transparent;
  padding: 13px 22px; font-weight: 600;
  background: var(--accent); color: #fff;
  transition: transform .15s ease, opacity .2s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); }
button:disabled { opacity: .55; cursor: progress; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* °C / °F segmented toggle */
.units { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
.units button { background: transparent; color: var(--ink-soft); padding: 8px 16px; }
.units button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* Error banner */
.error {
  display: none;
  margin-bottom: 20px; padding: 14px 18px;
  border-radius: var(--radius-sm);
  background: var(--danger-bg); color: var(--danger);
  border: 1px solid rgba(179, 38, 30, .25);
  font-weight: 600;
}
.error.show { display: block; }

/* Dashboard grid */
.dashboard { display: grid; gap: 20px; grid-template-columns: 1.15fr 1fr; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 28px;
  backdrop-filter: blur(14px);
}

/* Current weather (the one expressive element) */
.current { grid-row: span 2; display: flex; flex-direction: column; justify-content: space-between; min-height: 380px; }
.place { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.02em; }
.sub { margin: 4px 0 0; color: var(--ink-soft); }
.hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 22px 0; }
.hero-icon { font-size: clamp(4rem, 12vw, 6.5rem); line-height: 1; }
.hero-temp { font-size: clamp(4.2rem, 13vw, 7.5rem); font-weight: 800; line-height: .95; letter-spacing: -.05em; }
.hero-temp sup { font-size: .35em; font-weight: 600; letter-spacing: 0; vertical-align: top; position: relative; top: .35em; }
.condition { font-size: 1.25rem; font-weight: 600; margin: 0; }

/* Metric tiles */
.metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.metric { padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--panel); }
.metric dt { color: var(--ink-soft); font-size: .88rem; margin: 0 0 4px; }
.metric dd { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.metric small { font-size: .8rem; font-weight: 400; color: var(--ink-soft); }

/* Forecast */
.forecast h2, .recent h2 { margin: 0 0 14px; font-size: 1rem; }
.forecast ul { list-style: none; margin: 0; padding: 0; }
.forecast li {
  display: grid; grid-template-columns: 56px 36px 1fr auto;
  align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.forecast li:last-child { border-bottom: 0; }
.f-day { font-weight: 600; }
.f-icon { font-size: 1.5rem; }
.f-text { color: var(--ink-soft); font-size: .92rem; }
.f-temps { font-variant-numeric: tabular-nums; font-weight: 600; }
.f-temps span { color: var(--ink-soft); font-weight: 400; }

/* Recent searches */
.recent { grid-column: 1 / -1; padding: 20px 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: transparent; color: var(--ink); border-color: var(--line); padding: 8px 16px; }
.empty-note { margin: 0; color: var(--ink-soft); }

/* Loading skeleton: dims the dashboard while a request is running */
.dashboard.loading { opacity: .55; pointer-events: none; }

@media (max-width: 760px) {
  .dashboard { grid-template-columns: 1fr; }
  .current { grid-row: auto; }
  .card { padding: 22px; }
  .search { max-width: none; flex-basis: 100%; order: 3; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<body data-sky="clear-day">
<div class="app">

  <!-- ============ HEADER: brand, search, unit toggle ============ -->
  <header class="topbar">
    <h1 class="brand">Weather Dashboard</h1>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <label for="cityInput" class="sr-only" style="position:absolute;left:-9999px">City name</label>
      <input id="cityInput" type="search" placeholder="Search a city, e.g. Mumbai" maxlength="80" required>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div class="units" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="metric" aria-pressed="true">°C</button>
      <button type="button" data-unit="imperial" aria-pressed="false">°F</button>
    </div>
  </header>

  <!-- Screen-reader friendly error area -->
  <div class="error" id="error" role="alert"></div>

  <!-- ============ DASHBOARD ============ -->
  <main class="dashboard" id="dashboard">

    <section class="card current" aria-labelledby="placeName">
      <div>
        <h2 class="place" id="placeName">Loading…</h2>
        <p class="sub" id="placeSub">Fetching live data</p>
      </div>
      <div class="hero">
        <div class="hero-icon" id="heroIcon" aria-hidden="true">⛅</div>
        <div class="hero-temp" id="heroTemp">--</div>
      </div>
      <div>
        <p class="condition" id="condition">—</p>
        <p class="sub" id="feelsLike">&nbsp;</p>
      </div>
    </section>

    <section class="card" aria-label="Weather metrics">
      <dl class="metrics">
        <div class="metric"><dt>Humidity</dt><dd id="mHumidity">--</dd></div>
        <div class="metric"><dt>Wind speed</dt><dd id="mWind">--</dd></div>
        <div class="metric"><dt>Wind direction</dt><dd id="mDir">--</dd></div>
        <div class="metric"><dt>Pressure</dt><dd id="mPressure">--</dd></div>
      </dl>
    </section>

    <section class="card forecast" aria-label="5-day forecast">
      <h2>Next 5 days</h2>
      <ul id="forecastList"></ul>
    </section>

    <section class="card recent" aria-label="Recent searches">
      <h2>Recent searches</h2>
      <div class="chips" id="recentChips"></div>
    </section>

  </main>
</div>

<script>
/* =========================================================
   3. CONFIG
   Open-Meteo is free and needs no API key.
   Step 1: Geocoding API  -> city name  => latitude/longitude
   Step 2: Forecast API   -> coordinates => weather data
   ========================================================= */
const CONFIG = {
  geoUrl: "https://geocoding-api.open-meteo.com/v1/search",
  weatherUrl: "https://api.open-meteo.com/v1/forecast",
  timeoutMs: 10000,
  defaultCity: "Delhi",
  storageKey: "weather-dashboard:v1",
  maxRecent: 5,
};

/* WMO weather codes -> label, icon, and sky theme.
   Reference: https://open-meteo.com/en/docs (weather_code) */
const WEATHER_CODES = {
  0:  { text: "Clear sky",          icon: "☀️", night: "🌙", sky: "clear" },
  1:  { text: "Mainly clear",       icon: "🌤️", night: "🌙", sky: "clear" },
  2:  { text: "Partly cloudy",      icon: "⛅", night: "☁️", sky: "cloudy" },
  3:  { text: "Overcast",           icon: "☁️", night: "☁️", sky: "cloudy" },
  45: { text: "Fog",                icon: "🌫️", night: "🌫️", sky: "cloudy" },
  48: { text: "Freezing fog",       icon: "🌫️", night: "🌫️", sky: "cloudy" },
  51: { text: "Light drizzle",      icon: "🌦️", night: "🌧️", sky: "rain" },
  53: { text: "Drizzle",            icon: "🌦️", night: "🌧️", sky: "rain" },
  55: { text: "Heavy drizzle",      icon: "🌧️", night: "🌧️", sky: "rain" },
  56: { text: "Freezing drizzle",   icon: "🌧️", night: "🌧️", sky: "rain" },
  57: { text: "Freezing drizzle",   icon: "🌧️", night: "🌧️", sky: "rain" },
  61: { text: "Light rain",         icon: "🌦️", night: "🌧️", sky: "rain" },
  63: { text: "Rain",               icon: "🌧️", night: "🌧️", sky: "rain" },
  65: { text: "Heavy rain",         icon: "🌧️", night: "🌧️", sky: "rain" },
  66: { text: "Freezing rain",      icon: "🌧️", night: "🌧️", sky: "rain" },
  67: { text: "Freezing rain",      icon: "🌧️", night: "🌧️", sky: "rain" },
  71: { text: "Light snow",         icon: "🌨️", night: "🌨️", sky: "snow" },
  73: { text: "Snow",               icon: "❄️", night: "❄️", sky: "snow" },
  75: { text: "Heavy snow",         icon: "❄️", night: "❄️", sky: "snow" },
  77: { text: "Snow grains",        icon: "❄️", night: "❄️", sky: "snow" },
  80: { text: "Rain showers",       icon: "🌦️", night: "🌧️", sky: "rain" },
  81: { text: "Rain showers",       icon: "🌧️", night: "🌧️", sky: "rain" },
  82: { text: "Violent showers",    icon: "⛈️", night: "⛈️", sky: "storm" },
  85: { text: "Snow showers",       icon: "🌨️", night: "🌨️", sky: "snow" },
  86: { text: "Heavy snow showers", icon: "🌨️", night: "🌨️", sky: "snow" },
  95: { text: "Thunderstorm",       icon: "⛈️", night: "⛈️", sky: "storm" },
  96: { text: "Thunderstorm, hail", icon: "⛈️", night: "⛈️", sky: "storm" },
  99: { text: "Severe thunderstorm",icon: "⛈️", night: "⛈️", sky: "storm" },
};
const UNKNOWN_WEATHER = { text: "Unknown conditions", icon: "🌡️", night: "🌡️", sky: "cloudy" };

/* =========================================================
   4. CUSTOM ERRORS
   Lets the UI show a clear message for each failure type.
   ========================================================= */
class CityNotFoundError extends Error {
  constructor(city) { super(`We couldn't find "${city}". Check the spelling or try a nearby city.`); this.name = "CityNotFoundError"; }
}
class HttpError extends Error {
  constructor(status) { super(`The weather service returned an error (HTTP ${status}). Please try again shortly.`); this.name = "HttpError"; this.status = status; }
}
class NetworkError extends Error {
  constructor(msg) { super(msg); this.name = "NetworkError"; }
}

/* =========================================================
   5. API LAYER (Fetch + async/await)
   ========================================================= */

/** fetch() wrapper: adds a timeout, checks response.ok, parses JSON. */
async function fetchJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CONFIG.timeoutMs);

  try {
    const response = await fetch(url, { signal: controller.signal });
    // fetch() only rejects on network failure, NOT on 404/500, so we check manually
    if (!response.ok) throw new HttpError(response.status);
    return await response.json();
  } catch (err) {
    if (err instanceof HttpError) throw err;
    if (err.name === "AbortError") throw new NetworkError("The request timed out. Check your connection and try again.");
    if (!navigator.onLine) throw new NetworkError("You appear to be offline. Reconnect and try again.");
    throw new NetworkError("Couldn't reach the weather service. Check your connection and try again.");
  } finally {
    clearTimeout(timer);
  }
}

/** City name -> { name, country, admin, latitude, longitude } */
async function geocodeCity(city) {
  const params = new URLSearchParams({ name: city, count: "1", language: "en", format: "json" });
  const data = await fetchJson(`${CONFIG.geoUrl}?${params}`);
  if (!data.results || data.results.length === 0) throw new CityNotFoundError(city);
  return data.results[0];
}

/** Coordinates -> current conditions + 5-day forecast (always fetched in metric units) */
async function fetchWeather({ latitude, longitude }) {
  const params = new URLSearchParams({
    latitude, longitude,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min",
    forecast_days: "6",            // today + next 5
    timezone: "auto",
    wind_speed_unit: "kmh",
  });
  return fetchJson(`${CONFIG.weatherUrl}?${params}`);
}

/** Orchestrates both calls and returns one clean object for the UI. */
async function getWeatherForCity(city) {
  const place = await geocodeCity(city);
  const raw = await fetchWeather(place);
  return normalise(place, raw);
}

/** Shape raw API JSON into the exact fields the UI needs. */
function normalise(place, raw) {
  const c = raw.current;
  const d = raw.daily;
  return {
    place: {
      name: place.name,
      subtitle: [place.admin1, place.country].filter(Boolean).join(", "),
    },
    current: {
      tempC: c.temperature_2m,
      feelsC: c.apparent_temperature,
      humidity: c.relative_humidity_2m,
      windKmh: c.wind_speed_10m,
      windDeg: c.wind_direction_10m,
      pressure: c.surface_pressure,
      code: c.weather_code,
      isDay: c.is_day === 1,
    },
    // Skip index 0 (today) so the list shows the next 5 days
    forecast: d.time.slice(1).map((date, i) => ({
      date,
      code: d.weather_code[i + 1],
      maxC: d.temperature_2m_max[i + 1],
      minC: d.temperature_2m_min[i + 1],
    })),
  };
}

/* =========================================================
   6. UNIT + FORMAT HELPERS
   ========================================================= */
const state = { unit: "metric", data: null };

const cToF = (c) => (c * 9) / 5 + 32;
const kmhToMph = (k) => k * 0.621371;
const temp = (c) => Math.round(state.unit === "metric" ? c : cToF(c));
const unitSymbol = () => (state.unit === "metric" ? "°C" : "°F");
const windLabel = (k) => state.unit === "metric" ? `${Math.round(k)} <small>km/h</small>` : `${Math.round(kmhToMph(k))} <small>mph</small>`;

function compass(deg) {
  const points = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  return points[Math.round(deg / 45) % 8];
}
function describe(code) { return WEATHER_CODES[code] || UNKNOWN_WEATHER; }
function weekday(isoDate) {
  // Parse as local noon to avoid timezone day-shift bugs
  return new Date(`${isoDate}T12:00:00`).toLocaleDateString(undefined, { weekday: "short" });
}

/* =========================================================
   7. DOM LAYER
   ========================================================= */
const $ = (id) => document.getElementById(id);
const el = {
  form: $("searchForm"), input: $("cityInput"), btn: $("searchBtn"),
  error: $("error"), dashboard: $("dashboard"),
  placeName: $("placeName"), placeSub: $("placeSub"),
  heroIcon: $("heroIcon"), heroTemp: $("heroTemp"),
  condition: $("condition"), feelsLike: $("feelsLike"),
  humidity: $("mHumidity"), wind: $("mWind"), dir: $("mDir"), pressure: $("mPressure"),
  forecast: $("forecastList"), chips: $("recentChips"),
  unitButtons: document.querySelectorAll("[data-unit]"),
};

function showError(message) { el.error.textContent = message; el.error.classList.add("show"); }
function clearError() { el.error.textContent = ""; el.error.classList.remove("show"); }

function setLoading(isLoading) {
  el.dashboard.classList.toggle("loading", isLoading);
  el.dashboard.setAttribute("aria-busy", String(isLoading));
  el.btn.disabled = isLoading;
  el.btn.textContent = isLoading ? "Searching…" : "Search";
}

/** Paint the whole dashboard from state.data. Called after a fetch AND after a unit toggle. */
function render() {
  const { place, current, forecast } = state.data;
  const info = describe(current.code);

  // Theme the background to match the sky
  const period = current.isDay ? "day" : "night";
  document.body.dataset.sky =
    info.sky === "clear" ? `clear-${period}` :
    info.sky === "cloudy" && !current.isDay ? "cloudy-night" : info.sky;

  el.placeName.textContent = place.name;
  el.placeSub.textContent = place.subtitle || "—";
  el.heroIcon.textContent = current.isDay ? info.icon : info.night;
  el.heroTemp.innerHTML = `${temp(current.tempC)}<sup>${unitSymbol()}</sup>`;
  el.condition.textContent = info.text;
  el.feelsLike.textContent = `Feels like ${temp(current.feelsC)}${unitSymbol()}`;

  el.humidity.innerHTML = `${current.humidity}<small>%</small>`;
  el.wind.innerHTML = windLabel(current.windKmh);
  el.dir.textContent = `${compass(current.windDeg)} (${Math.round(current.windDeg)}°)`;
  el.pressure.innerHTML = `${Math.round(current.pressure)} <small>hPa</small>`;

  el.forecast.innerHTML = forecast.map((day) => {
    const d = describe(day.code);
    return `<li>
      <span class="f-day">${weekday(day.date)}</span>
      <span class="f-icon" aria-hidden="true">${d.icon}</span>
      <span class="f-text">${d.text}</span>
      <span class="f-temps">${temp(day.maxC)}° <span>${temp(day.minC)}°</span></span>
    </li>`;
  }).join("");
}

/* =========================================================
   8. RECENT SEARCHES (localStorage, always in try/catch)
   ========================================================= */
function loadStore() {
  try { return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || { recent: [], unit: "metric" }; }
  catch { return { recent: [], unit: "metric" }; }   // storage blocked or corrupted
}
function saveStore(patch) {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify({ ...loadStore(), ...patch })); }
  catch { /* storage unavailable: app still works, just without memory */ }
}
function rememberCity(name) {
  const recent = loadStore().recent.filter((c) => c.toLowerCase() !== name.toLowerCase());
  recent.unshift(name);
  saveStore({ recent: recent.slice(0, CONFIG.maxRecent) });
  renderRecent();
}
function renderRecent() {
  const { recent } = loadStore();
  if (!recent.length) { el.chips.innerHTML = '<p class="empty-note">Cities you search will show up here.</p>'; return; }
  el.chips.innerHTML = "";
  recent.forEach((city) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = city;            // textContent (not innerHTML) keeps this XSS-safe
    b.addEventListener("click", () => search(city));
    el.chips.appendChild(b);
  });
}

/* =========================================================
   9. CONTROLLER
   ========================================================= */
async function search(rawCity) {
  const city = rawCity.trim();
  if (!city) { showError("Type a city name to search."); return; }

  clearError();
  setLoading(true);
  try {
    state.data = await getWeatherForCity(city);
    render();
    rememberCity(state.data.place.name);
    el.input.value = "";
  } catch (err) {
    // Known errors carry user-friendly messages; anything else gets a generic one
    const known = err instanceof CityNotFoundError || err instanceof HttpError || err instanceof NetworkError;
    showError(known ? err.message : "Something went wrong. Please try again.");
    console.error(err);
  } finally {
    setLoading(false);               // always runs, success or failure
  }
}

function setUnit(unit) {
  state.unit = unit;
  saveStore({ unit });
  el.unitButtons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.unit === unit)));
  if (state.data) render();          // re-render from cached data, no new request needed
}

/* =========================================================
   10. INIT
   ========================================================= */
el.form.addEventListener("submit", (e) => { e.preventDefault(); search(el.input.value); });
el.unitButtons.forEach((b) => b.addEventListener("click", () => setUnit(b.dataset.unit)));

  setUnit(store.unit === "imperial" ? "imperial" : "metric");

})();
</script>
