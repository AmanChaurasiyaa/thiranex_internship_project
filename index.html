<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__head">
      <h1>Today's tasks</h1>
      <button id="themeToggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">◐</button>
    </header>

    <!-- Create: the form blocks empty submissions in script.js -->
    <form id="addForm" class="add" novalidate>
      <input id="taskInput" type="text" placeholder="What needs doing?" maxlength="120" autocomplete="off" aria-label="New task" />
      <button type="submit" class="btn btn--primary">Add task</button>
    </form>
    <p id="error" class="error" role="alert" hidden>Type a task before adding it.</p>

    <!-- Filters -->
    <nav class="filters" id="filters" aria-label="Filter tasks">
      <button class="filter is-active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </nav>

    <!-- Task list: one click/keydown listener lives on this <ul> (event delegation) -->
    <ul id="taskList" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="foot">
      <span id="counter">0 items left</span>
      <button id="clearCompleted" class="btn btn--ghost">Clear completed</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
